name: CI

# CI comes from spa-platform's reusable workflow, pinned to a commit. CI Result stays here so the required check's
# name doesn't depend on the platform.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: arsw-dev/spa-platform/.github/workflows/site-ci.yml@880c72e40d7ddc655b7efc2a4f90fb8cf9947a5f # v1.0.0-rc.2
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      plan-role-arn: arn:aws:iam::559401928721:role/arsw-dev-terraform-plan
      function-name: arsw-portfolio-viewer-request
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # The only required status check. Fails if the CI jobs failed or were cancelled; a skipped Plan (Dependabot) is fine.
  result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()

    steps:
      - name: Check Job Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
