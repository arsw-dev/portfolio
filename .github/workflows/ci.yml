name: CI

# One workflow, one required check (CI Result). Everything runs on every PR; each job is small enough that
# path filtering isn't worth the moving parts. Within a job, checks keep running after one fails so a single
# run reports every failure.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Explicit bash gets -o pipefail; without it `terraform plan | tee` passes even when the plan fails
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck Deploy Tool
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter deploy typecheck

      - name: Test Deploy Tool
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter deploy test

      - name: Test CloudFront Function
        if: ${{ !cancelled() }}
        run: node --test "infra/modules/static-site/functions/*.test.ts"

      - name: Build Site
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter site build

      - name: Install Workflow Linter
        id: actionlint
        if: ${{ !cancelled() }}
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum --check
          tar xzf actionlint.tar.gz actionlint

      - name: Lint Workflows
        if: ${{ !cancelled() && steps.actionlint.outcome == 'success' }}
        run: ./actionlint -color

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Exact version: must match the Terraform used for local applies (setup-terraform treats ~> as npm-style ~, i.e. patch-only)
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Check Formatting
        run: terraform fmt -check -recursive infra

      - name: Test Static Site Module
        if: ${{ !cancelled() }}
        working-directory: infra/modules/static-site
        run: |
          terraform init -backend=false -input=false
          terraform test

      # terraform test compares values, and a validated certificate's ARN equals the unvalidated one, so the rule
      # that CloudFront waits for validation is checked on the dependency graph instead
      - name: Check CloudFront Waits for Certificate Validation
        if: ${{ !cancelled() }}
        working-directory: infra/modules/static-site
        run: |
          if ! terraform graph | grep -qF '"aws_cloudfront_distribution.this" -> "aws_acm_certificate_validation.this"'; then
            echo "::error::aws_cloudfront_distribution.this must take its certificate from aws_acm_certificate_validation.this"
            exit 1
          fi

      - name: Test Cloudflare DNS Module
        if: ${{ !cancelled() }}
        working-directory: infra/modules/cloudflare-dns
        run: |
          terraform init -backend=false -input=false
          terraform test

      - name: Test Account Bootstrap Module
        if: ${{ !cancelled() }}
        working-directory: infra/modules/account-bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform test

  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Dependabot runs get no OIDC token, so they can't assume the plan role
    if: github.actor != 'dependabot[bot]'
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed before credentials exist, so no third-party setup code runs with them
      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::559401928721:role/arsw-dev-terraform-plan
          aws-region: us-east-1

      - name: Plan Site
        env:
          # DNS:Read only for the arsw.dev zone; plans must never be able to change DNS
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # An empty token isn't rejected by the provider; it sends unauthenticated requests that fail obscurely
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it as a repository secret (Settings → Secrets and variables → Actions → Repository secrets), not an environment secret or a variable."
            exit 1
          fi
          terraform -chdir=infra init -input=false
          terraform -chdir=infra validate
          terraform -chdir=infra plan -no-color -input=false 2>&1 | tee infra/plan.txt

      - name: Plan Bootstrap
        if: ${{ !cancelled() }}
        run: |
          terraform -chdir=infra/bootstrap init -input=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/bootstrap plan -no-color -input=false 2>&1 | tee infra/bootstrap/plan.txt

      - name: Comment Plans
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            for (const dir of ['infra', 'infra/bootstrap']) {
              const planPath = `${dir}/plan.txt`;
              if (!fs.existsSync(planPath)) continue;
              const plan = fs.readFileSync(planPath, 'utf8');
              if (plan.includes('No changes.')) continue;

              const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
              const marker = `<!-- terraform-plan:${dir} -->`;
              const body = `${marker}\n<details><summary>Terraform Plan: ${dir}</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
              const existing = comments.find(c => c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  comment_id: existing.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                });
              }
            }

      # Runs the function test cases in CloudFront's own runtime. Infra is applied before a PR is pushed,
      # so the LIVE function is this branch's code.
      - name: Test CloudFront Function (Live Runtime)
        if: ${{ !cancelled() }}
        run: infra/modules/static-site/functions/test-live.sh
        env:
          FUNCTION_NAME: arsw-portfolio-viewer-request

  # The only required status check. Fails if any job failed or was cancelled; a skipped Plan (Dependabot) is fine.
  result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [checks, terraform, plan]
    if: always()

    steps:
      - name: Check Job Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
