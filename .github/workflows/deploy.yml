name: Deploy

# Build, deploy and smoke test come from spa-platform's reusable workflow, pinned to a commit; the deploy tool runs
# from that same commit.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    uses: arsw-dev/spa-platform/.github/workflows/site-deploy.yml@880c72e40d7ddc655b7efc2a4f90fb8cf9947a5f # v1.0.0-rc.2
    permissions:
      contents: read
      id-token: write
