name: Deploy

# Build, deploy and smoke test come from spa-platform's reusable workflow, pinned to a commit; the deploy tool runs
# from that same commit.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    uses: arsw-dev/spa-platform/.github/workflows/site-deploy.yml@54e67d10190a64a251225308642366a1820b78a6 # feat/reusable-workflows (arsw-dev/spa-platform#3)
    permissions:
      contents: read
      id-token: write
